```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web GIS</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"
    />

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <div class="logo">
        🌍 Web GIS
    </div>

    <div class="tools">
        <button onclick="goHome()">🏠 خانه</button>
        <button onclick="locateUser()">📍 موقعیت من</button>
        <button onclick="togglePanel()">☰ ابزارها</button>
    </div>
</header>

<div id="map"></div>

<div id="sidePanel">

    <h2>ابزارهای Web GIS</h2>

    <div class="section">
        <h3>جستجوی مکان</h3>

        <div class="searchBox">
            <input
                id="searchInput"
                type="text"
                placeholder="نام مکان را وارد کنید..."
            >

            <button onclick="searchPlace()">جستجو</button>
        </div>

        <div id="searchResults"></div>
    </div>

    <div class="section">

        <h3>لایه‌ها</h3>

        <label>
            <input
                type="checkbox"
                id="osmLayer"
                checked
                onchange="toggleOSM()"
            >
            OpenStreetMap
        </label>

        <label>
            <input
                type="checkbox"
                id="satelliteLayer"
                onchange="toggleSatellite()"
            >
            تصاویر ماهواره‌ای
        </label>
    </div>

    <div class="section">

        <h3>داده مکانی</h3>

        <label class="fileButton">
            📂 بارگذاری GeoJSON
            <input
                type="file"
                id="geojsonFile"
                accept=".geojson,.json"
                onchange="loadGeoJSON(event)"
            >
        </label>

        <button onclick="downloadGeoJSON()">
            💾 دانلود GeoJSON
        </button>

    </div>

    <div class="section">

        <h3>ابزارها</h3>

        <button onclick="clearDrawings()">
            🗑 پاک کردن ترسیمات
        </button>

        <button onclick="showCoordinates()">
            📐 مختصات مرکز نقشه
        </button>

    </div>

    <div class="info">
        <b>مختصات موس:</b>
        <span id="mouseCoordinates">
            -
        </span>
    </div>

</div>

<div id="coordinatesBox">
    مختصات:
    <span id="coords">-</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

<script src="app.js"></script>

</body>
</html>
```
