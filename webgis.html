        /* -------------------------
           Loading

        }

        .loading.show {
            display: block;
        }

        /* -------------------------
           Responsive
        ------------------------- */

        @media (max-width: 800px) {

            .sidebar {
                position: absolute;

                width: 290px;
                min-width: 290px;

            }

            .feature-info {
                left: 10px;

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin="">
</script>


<script>

    /* =====================================
       MAP
    ===================================== */

    const map = L.map('map', {
        zoomControl: false
    }).setView(
        [29.6, 52.5],
        7
    );


    /* =====================================
       BASE MAP
    ===================================== */

    const osmLayer = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    );

    osmLayer.addTo(map);


    /* =====================================
       LAYER GROUPS
    ===================================== */

    let shahrestanLayer = null;

    const emptyLayer = L.layerGroup();


    /* =====================================
       LOAD SHAHRESTAN GEOJSON
    ===================================== */

    const loading =
        document.getElementById('loading');

    const status =
        document.getElementById('status');

    loading.classList.add('show');


    fetch('./shahrestan.geojson')

        .then(function(response) {

            if (!response.ok) {
                throw new Error(
                    'خطا در دریافت shahrestan.geojson'
                );
            }

            return response.json();
        })

        .then(function(data) {

            shahrestanLayer =
                L.geoJSON(
                    data,
                    {

                        style: function(feature) {

                            return {
                                color: '#2563eb',
                                weight: 2,
                                opacity: 1,
                                fillColor: '#60a5fa',
                                fillOpacity: 0.22
                            };

                        },


                        onEachFeature:
                            function(
                                feature,
                                layer
                            ) {

                                /* ----------------
                                   Popup
                                ---------------- */

                                let popupHTML =
                                    '<div dir="rtl" style="min-width:180px">';

                                popupHTML +=
                                    '<h3 style="margin-top:0;color:#1d4ed8;">';

                                popupHTML +=
                                    'اطلاعات شهرستان';

                                popupHTML +=
                                    '</h3>';


                                if (
                                    feature.properties
                                ) {

                                    Object.keys(
                                        feature.properties
                                    ).forEach(
                                        function(key) {

                                            const value =
                                                feature
                                                .properties
                                                [key];

                                            if (
                                                value !== null &&
                                                value !== undefined &&
                                                value !== ''
                                            ) {

                                                popupHTML +=
                                                    '<div style="padding:4px 0;border-bottom:1px solid #eee">';

                                                popupHTML +=
                                                    '<strong>' +
                                                    key +
                                                    ':</strong> ';

                                                popupHTML +=
                                                    value;

                                                popupHTML +=
                                                    '</div>';

                                            }

                                        }
                                    );

                                }

                                popupHTML +=
                                    '</div>';


                                layer.bindPopup(
                                    popupHTML
                                );


                                /* ----------------
                                   Mouse events
                                ---------------- */

                                layer.on({

                                    mouseover:
                                        function(e) {

                                            e.target.setStyle({
                                                weight: 3,
                                                color: '#1d4ed8',
                                                fillColor: '#3b82f6',
                                                fillOpacity: 0.45
                                            });

                                            e.target.bringToFront();
                                        },


                                    mouseout:
                                        function(e) {

                                            if (
                                                shahrestanLayer
                                            ) {

                                                shahrestanLayer
                                                    .resetStyle(
                                                        e.target
                                                    );

                                            }

                                        },


                                    click:
                                        function(e) {

                                            showFeatureInfo(
                                                feature
                                            );

                                        }

                                });

                            }

                    }
                );


                /*
                 * لایه شهرستان‌ها به صورت پیش‌فرض
                 * نمایش داده می‌شود.
                 */

                shahrestanLayer.addTo(map);


                /* ----------------
                   Fit map
                ---------------- */

                try {

                    const bounds =
                        shahrestanLayer.getBounds();

                    if (
                        bounds.isValid()
                    ) {

                        map.fitBounds(
                            bounds,
                            {
                                padding: [20, 20]
                            }
                        );

                    }

                } catch (error) {

                    console.warn(
                        'امکان تنظیم محدوده نقشه وجود ندارد',
                        error
                    );

                }


                loading.classList.remove(
                    'show'
                );


                status.innerHTML =
                    'سیستم WebGIS فعال | لایه شهرستان‌ها بارگذاری شد';

            })

            .catch(function(error) {

                console.error(
                    error
                );

                loading.classList.remove(
                    'show'
                );

                status.innerHTML =
                    '⚠ خطا در بارگذاری لایه شهرستان‌ها';

                status.style.background =
                    '#fef2f2';

                status.style.color =
                    '#b91c1c';

                alert(
                    'فایل shahrestan.geojson پیدا نشد یا قابل بارگذاری نیست.'
                );

            });


    /* =====================================
       LAYER CHECKBOX
    ===================================== */

    document
        .getElementById(
            'shahrestanLayer'
        )
        .addEventListener(
            'change',
            function() {

                if (
                    !shahrestanLayer
                ) {
                    return;
                }


                if (
                    this.checked
                ) {

                    shahrestanLayer.addTo(
                        map
                    );

                } else {

                    map.removeLayer(
                        shahrestanLayer
                    );

                }

            }
        );


    /* =====================================
       FEATURE INFO
    ===================================== */

    function showFeatureInfo(
        feature
    ) {

        const info =
            document.getElementById(
                'featureInfo'
            );

        const content =
            document.getElementById(
                'featureContent'
            );

        content.innerHTML = '';


        if (
            feature &&
            feature.properties
        ) {

            Object.keys(
                feature.properties
            ).forEach(
                function(key) {

                    const value =
                        feature.properties[key];

                    if (
                        value !== null &&
                        value !== undefined &&
                        value !== ''
                    ) {

                        const div =
                            document.createElement(
                                'div'
                            );

                        div.className =
                            'property';

                        div.innerHTML =
                            '<span class="property-key">' +
                            key +
                            ':</span> ' +
                            value;

                        content.appendChild(
                            div
                        );

                    }

                }
            );

        }


        info.classList.add(
            'show'
        );

    }


    document
        .getElementById(
            'closeInfo'
        )
        .addEventListener(
            'click',
            function() {

                document
                    .getElementById(
                        'featureInfo'
                    )
                    .classList.remove(
                        'show'
                    );

            }
        );


    /* =====================================
       ZOOM CONTROLS
    ===================================== */

    document
        .getElementById(
            'zoomInButton'
        )
        .addEventListener(
            'click',
            function() {

                map.zoomIn();

            }
        );


    document
        .getElementById(
            'zoomOutButton'
        )
        .addEventListener(
            'click',
            function() {

                map.zoomOut();

            }
        );


    /* =====================================
       FARS / SHIRAZ AREA
    ===================================== */

    document
        .getElementById(
            'farsButton'
        )
        .addEventListener(
            'click',
            function() {

                if (
                    shahrestanLayer
                ) {

                    const bounds =
                        shahrestanLayer
                            .getBounds();

                    if (
                        bounds.isValid()
                    ) {

                        map.fitBounds(
                            bounds,
                            {
                                padding: [20, 20]
                            }
                        );

                    }

                } else {

                    map.setView(
                        [29.6, 52.5],
                        7
                    );

                }

            }
        );


    /* =====================================
       HOME
    ===================================== */

    document
        .getElementById(
            'homeButton'
        )
        .addEventListener(
            'click',
            function() {

                map.setView(
                    [29.6, 52.5],
                    7
                );

            }
        );


    /* =====================================
       USER LOCATION
    ===================================== */

    document
        .getElementById(
            'locationButton'
        )
        .addEventListener(
            'click',
            function() {

                map.locate({
                    setView: true,
                    maxZoom: 15
                });

            }
        );


    map.on(
        'locationfound',
        function(e) {

            L.marker(
                e.latlng
            )
            .addTo(map)
            .bindPopup(
                'موقعیت فعلی شما'
            )
            .openPopup();

        }
    );


    map.on(
        'locationerror',
        function() {

            alert(
                'امکان دریافت موقعیت مکانی وجود ندارد.'
            );

        }
    );


    /* =====================================
       SEARCH
    ===================================== */

    function performSearch() {

        const query =
            document
                .getElementById(
                    'searchInput'
                )
                .value
                .trim()
                .toLowerCase();


        if (
            !query
        ) {

            return;

        }


        /*
         * جستجو در نام شهرستان‌ها
         */

        if (
            shahrestanLayer
        ) {

            let found =
                false;


            shahrestanLayer.eachLayer(
                function(layer) {

                    if (
                        found
                    ) {
                        return;
                    }


                    const properties =
                        layer.feature &&
                        layer.feature.properties;


                    if (
                        !properties
                    ) {
                        return;
                    }


                    const text =
                        JSON.stringify(
                            properties
                        ).toLowerCase();


                    if (
                        text.includes(
                            query
                        )
                    ) {

                        found =
                            true;


                        map.fitBounds(
                            layer.getBounds(),
                            {
                                padding: [
                                    50,
                                    50
                                ]
                            }
                        );


                        layer.openPopup();


                        layer.setStyle({
                            weight: 4,
                            color: '#dc2626',
                            fillOpacity: 0.5
                        });


                        setTimeout(
                            function() {

                                shahrestanLayer
                                    .resetStyle(
                                        layer
                                    );

                            },
                            2500
                        );

                    }

                }
            );


            if (
                found
            ) {

                return;

            }

        }


        /*
         * اگر شهرستان پیدا نشد،
         * جستجوی عمومی Nominatim
         */

        const url =
            'https://nominatim.openstreetmap.org/search' +
            '?format=json' +
            '&limit=1' +
            '&q=' +
            encodeURIComponent(
                query + ', فارس, ایران'
            );


        fetch(
            url,
            {
                headers: {
                    'Accept-Language': 'fa'
                }
            }
        )

        .then(
            response =>
                response.json()
        )

        .then(
            results => {

                if (
                    results.length === 0
                ) {

                    alert(
                        'مکان مورد نظر پیدا نشد.'
                    );

                    return;

                }


                const result =
                    results[0];


                const lat =
                    parseFloat(
                        result.lat
                    );

                const lon =
                    parseFloat(
                        result.lon
                    );


                map.setView(
                    [lat, lon],
                    13
                );


                L.marker(
                    [lat, lon]
                )
                .addTo(map)
                .bindPopup(
                    result.display_name
                )
                .openPopup();

            }
        )

        .catch(
            function(error) {

                console.error(
                    error
                );

                alert(
                    'خطا در جستجوی مکان.'
                );

            }
        );

    }


    document
        .getElementById(
            'searchButton'
        )
        .addEventListener(
            'click',
            performSearch
        );


    document
        .getElementById(
            'searchInput'
        )
        .addEventListener(
            'keydown',
            function(e) {

                if (
                    e.key === 'Enter'
                ) {

                    performSearch();

                }

            }
        );


</script>

</body>
</html>
