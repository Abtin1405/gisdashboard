
<style>
  .gis-tools-panel {
    position: absolute;
    top: 70px;
    right: 15px;
    z-index: 1000;
    width: 290px;
    background: rgba(255,255,255,.97);
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.18);
    direction: rtl;
    font-family: Tahoma, Arial, sans-serif;
    overflow: hidden;
  }

  .gis-tools-header {
    background: #263238;
    color: white;
    padding: 12px 15px;
    font-weight: bold;
  }

  .gis-tools-body {
    padding: 10px;
    max-height: 75vh;
    overflow-y: auto;
  }

  .gis-tool-group {
    margin-bottom: 10px;
    border-bottom: 1px solid #ddd;
    padding-bottom: 8px;
  }

  .gis-tool-group-title {
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 7px;
    color: #37474f;
  }

  .gis-tool {
    width: 100%;
    border: 1px solid #ddd;
    background: #fafafa;
    padding: 8px;
    margin: 3px 0;
    border-radius: 6px;
    cursor: pointer;
    text-align: right;
    font-size: 12px;
  }

  .gis-tool:hover {
    background: #eeeeee;
  }

  .gis-tool.active {
    background: #263238;
    color: white;
  }

  .gis-input {
    width: 100%;
    box-sizing: border-box;
    padding: 7px;
    border: 1px solid #ccc;
    border-radius: 5px;
    margin: 3px 0;
    direction: ltr;
  }

  .gis-status {
    background: #f5f5f5;
    padding: 8px;
    border-radius: 5px;
    font-size: 11px;
    margin-top: 5px;
  }

  .gis-coordinate {
    position: absolute;
    bottom: 5px;
    left: 5px;
    z-index: 1000;
    background: rgba(255,255,255,.9);
    padding: 6px 10px;
    border-radius: 5px;
    direction: ltr;
    font-family: monospace;
    font-size: 12px;
  }

  .gis-measure-result {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: white;
    padding: 8px 15px;
    border-radius: 7px;
    box-shadow: 0 2px 10px rgba(0,0,0,.2);
    direction: rtl;
  }
</style>

<div id="gisToolsPanel" class="gis-tools-panel">

  <div class="gis-tools-header">
    ابزارهای GIS
  </div>

  <div class="gis-tools-body">

    <!-- مدیریت نقشه -->
    <div class="gis-tool-group">
      <div class="gis-tool-group-title">
        🗺 مدیریت نقشه
      </div>

      <button class="gis-tool" onclick="gisLocateCoordinate()">
        📍 نمایش مختصات دلخواه
      </button>

      <button class="gis-tool" onclick="gisGoToMyLocation()">
        📌 موقعیت فعلی
      </button>

      <button class="gis-tool" onclick="gisToggleBaseMap()">
        🛰 روشن / خاموش کردن نقشه پایه
      </button>
    </div>

    <!-- لایه ها -->
    <div class="gis-tool-group">
      <div class="gis-tool-group-title">
        📚 مدیریت لایه‌ها
      </div>

      <button class="gis-tool" onclick="gisToggleLayers()">
        ☑ نمایش / مخفی کردن لایه‌ها
      </button>
    </div>

    <!-- اندازه گیری -->
    <div class="gis-tool-group">
      <div class="gis-tool-group-title">
        📐 اندازه‌گیری
      </div>

      <button class="gis-tool" onclick="gisStartMeasureDistance()">
        📏 اندازه‌گیری طول
      </button>

      <button class="gis-tool" onclick="gisStartMeasureArea()">
        📐 اندازه‌گیری مساحت
      </button>

      <button class="gis-tool" onclick="gisClearMeasurement()">
        🗑 پاک کردن اندازه‌گیری
      </button>

      <div id="gisMeasureStatus" class="gis-status">
        آماده
      </div>
    </div>

    <!-- انتخاب عوارض -->
    <div class="gis-tool-group">
      <div class="gis-tool-group-title">
        🎯 انتخاب عوارض
      </div>

      <button class="gis-tool" onclick="gisSelectPoint()">
        انتخاب با کلیک
      </button>

      <button class="gis-tool" onclick="gisSelectRectangle()">
        انتخاب مستطیلی
      </button>

      <button class="gis-tool" onclick="gisSelectPolygon()">
        انتخاب چندضلعی
      </button>

      <button class="gis-tool" onclick="gisClearSelection()">
        پاک کردن انتخاب
      </button>
    </div>

    <!-- ترسیم -->
    <div class="gis-tool-group">
      <div class="gis-tool-group-title">
        ✏️ ترسیم عوارض
      </div>

      <button class="gis-tool" onclick="gisDrawPoint()">
        ● ترسیم نقطه
      </button>

      <button class="gis-tool" onclick="gisDrawLine()">
        ━ ترسیم خط
      </button>

      <button class="gis-tool" onclick="gisDrawPolygon()">
        ⬠ ترسیم پلیگون
      </button>

      <button class="gis-tool" onclick="gisFinishDrawing()">
        ✔ پایان ترسیم
      </button>

      <button class="gis-tool" onclick="gisClearDrawings()">
        🗑 پاک کردن ترسیمات
      </button>

      <button class="gis-tool" onclick="gisExportKMZ()">
        ⬇ خروجی KMZ
      </button>
    </div>

    <!-- بافر -->
    <div class="gis-tool-group">

      <div class="gis-tool-group-title">
        ⭕ بافر
      </div>

      <input
        id="gisBufferDistance"
        class="gis-input"
        type="number"
        value="100"
        min="1"
        placeholder="فاصله بافر بر حسب متر">

      <button class="gis-tool" onclick="gisCreateBuffer()">
        ایجاد بافر
      </button>

    </div>

    <!-- تبدیل مختصات -->
    <div class="gis-tool-group">

      <div class="gis-tool-group-title">
        🔄 تبدیل مختصات
      </div>

      <input
        id="gisLat"
        class="gis-input"
        placeholder="Latitude">

      <input
        id="gisLng"
        class="gis-input"
        placeholder="Longitude">

      <button class="gis-tool" onclick="gisConvertToUTM()">
        تبدیل WGS84 به UTM
      </button>

      <div id="gisConversionResult" class="gis-status">
        نتیجه تبدیل
      </div>

    </div>

    <!-- خروجی -->
    <div class="gis-tool-group">

      <div class="gis-tool-group-title">
        🖨 خروجی نقشه
      </div>

      <button class="gis-tool" onclick="gisExportPNG()">
        خروجی PNG
      </button>

      <button class="gis-tool" onclick="window.print()">
        🖨 چاپ نقشه
      </button>

    </div>

  </div>
</div>

<div id="gisCoordinateDisplay" class="gis-coordinate">
  Lat: -- | Lng: --
</div>


<script>

/* =========================================================
   GIS TOOL ENGINE
   ========================================================= */

(function () {

  if (typeof map === "undefined") {
    console.error(
      "GIS Tools: متغیر map پیدا نشد. نام متغیر نقشه باید map باشد."
    );
    return;
  }

  window.gisTools = {
    map: map,
    drawings: L.featureGroup().addTo(map),
    measurements: L.featureGroup().addTo(map),
    selections: L.featureGroup().addTo(map),
    activeTool: null,
    points: [],
    currentLine: null,
    currentPolygon: null
  };

  /*
   * نمایش مختصات مکان‌نما
   */
  map.on("mousemove", function (e) {

    document.getElementById(
      "gisCoordinateDisplay"
    ).innerHTML =
      "Lat: " +
      e.latlng.lat.toFixed(6) +
      " | Lng: " +
      e.latlng.lng.toFixed(6);

  });


  /*
   * کلیک روی نقشه
   */
  map.on("click", function (e) {

    if (gisTools.activeTool === "point") {

      const marker = L.marker(e.latlng)
        .bindPopup(
          "مختصات:<br>" +
          e.latlng.lat.toFixed(6) +
          "<br>" +
          e.latlng.lng.toFixed(6)
        );

      gisTools.drawings.addLayer(marker);

      gisTools.activeTool = null;

    }

  });

})();


/* =========================================================
   MAP MANAGEMENT
   ========================================================= */

function gisLocateCoordinate() {

  const lat = prompt("عرض جغرافیایی (Latitude):");
  const lng = prompt("طول جغرافیایی (Longitude):");

  if (!lat || !lng) return;

  const point = [
    parseFloat(lat),
    parseFloat(lng)
  ];

  map.setView(point, 15);

  L.marker(point)
    .addTo(gisTools.drawings)
    .bindPopup(
      "مختصات<br>" +
      lat + "<br>" +
      lng
    )
    .openPopup();
}


function gisGoToMyLocation() {

  map.locate({
    setView: true,
    maxZoom: 17
  });

}


function gisToggleBaseMap() {

  const layers = [];

  map.eachLayer(function(layer) {

    if (
      layer instanceof L.TileLayer ||
      layer instanceof L.TileLayer.WMS
    ) {
      layers.push(layer);
    }

  });

  layers.forEach(function(layer) {

    if (map.hasLayer(layer))
      map.removeLayer(layer);
    else
      map.addLayer(layer);

  });

}


/* =========================================================
   LAYER MANAGEMENT
   ========================================================= */

function gisToggleLayers() {

  const panel = document.getElementById("gisToolsPanel");

  alert(
    "مدیریت لایه‌ها:\n\n" +
    "برای اتصال این قسمت به لایه‌های موجود، " +
    "نام Layerها یا Layer Control فعلی داشبورد را مشخص کنید."
  );

}


/* =========================================================
   MEASUREMENT
   ========================================================= */

let gisMeasurePoints = [];
let gisMeasureLayer = null;


function gisStartMeasureDistance() {

  gisClearMeasurement();

  gisMeasurePoints = [];

  document.getElementById(
    "gisMeasureStatus"
  ).innerHTML =
    "روی نقشه کلیک کنید؛ برای پایان دوبار کلیک کنید.";

  map.getContainer().style.cursor = "crosshair";

  gisTools.activeTool = "measure-distance";

  map.once("click", gisMeasureClick);

}


function gisMeasureClick(e) {

  gisMeasurePoints.push(e.latlng);

  if (gisMeasurePoints.length === 1) {

    gisMeasureLayer =
      L.polyline(
        gisMeasurePoints,
        { weight: 4 }
      ).addTo(gisTools.measurements);

  } else {

    gisMeasureLayer.setLatLngs(
      gisMeasurePoints
    );

    let total = 0;

    for (
      let i = 1;
      i < gisMeasurePoints.length;
      i++
    ) {

      total +=
        gisMeasurePoints[i - 1]
          .distanceTo(
            gisMeasurePoints[i]
          );

    }

    document.getElementById(
      "gisMeasureStatus"
    ).innerHTML =
      "طول: " +
      total.toFixed(2) +
      " متر";

  }

  map.once("click", gisMeasureClick);

}


function gisStartMeasureArea() {

  gisClearMeasurement();

  gisMeasurePoints = [];

  document.getElementById(
    "gisMeasureStatus"
  ).innerHTML =
    "نقاط محدوده را انتخاب کنید و برای پایان دوبار کلیک کنید.";

  gisTools.activeTool = "measure-area";

  map.once("click", gisAreaClick);

}


function gisAreaClick(e) {

  gisMeasurePoints.push(e.latlng);

  if (!gisMeasureLayer) {

    gisMeasureLayer =
      L.polygon(
        gisMeasurePoints,
        { weight: 3 }
      ).addTo(gisTools.measurements);

  } else {

    gisMeasureLayer.setLatLngs(
      gisMeasurePoints
    );

  }

  if (gisMeasurePoints.length >= 3) {

    const area =
      gisCalculateArea(
        gisMeasurePoints
      );

    document.getElementById(
      "gisMeasureStatus"
    ).innerHTML =
      "مساحت: " +
      area.toFixed(2) +
      " مترمربع";

  }

  map.once("click", gisAreaClick);

}


function gisCalculateArea(points) {

  let area = 0;

  for (
    let i = 0;
    i < points.length;
    i++
  ) {

    const j =
      (i + 1) % points.length;

    area +=
      points[i].lng *
      points[j].lat;

    area -=
      points[j].lng *
      points[i].lat;

  }

  return Math.abs(area) *
    12364 *
    1000000;

}


function gisClearMeasurement() {

  gisMeasurePoints = [];

  gisTools.measurements.clearLayers();

  gisMeasureLayer = null;

  gisTools.activeTool = null;

  map.getContainer().style.cursor = "";

  document.getElementById(
    "gisMeasureStatus"
  ).innerHTML = "آماده";

}


/* =========================================================
   DRAWING
   ========================================================= */

function gisDrawPoint() {

  gisFinishDrawing();

  gisTools.activeTool = "point";

  map.getContainer().style.cursor = "crosshair";

}


function gisDrawLine() {

  gisFinishDrawing();

  gisTools.points = [];

  gisTools.activeTool = "line";

  map.getContainer().style.cursor = "crosshair";

  map.on(
    "click",
    gisLineClick
  );

}


function gisLineClick(e) {

  gisTools.points.push(e.latlng);

  if (!gisTools.currentLine) {

    gisTools.currentLine =
      L.polyline(
        gisTools.points,
        { weight: 4 }
      ).addTo(
        gisTools.drawings
      );

  } else {

    gisTools.currentLine.setLatLngs(
      gisTools.points
    );

  }

}


function gisDrawPolygon() {

  gisFinishDrawing();

  gisTools.points = [];

  gisTools.activeTool = "polygon";

  map.getContainer().style.cursor = "crosshair";

  map.on(
    "click",
    gisPolygonClick
  );

}


function gisPolygonClick(e) {

  gisTools.points.push(e.latlng);

  if (!gisTools.currentPolygon) {

    gisTools.currentPolygon =
      L.polygon(
        gisTools.points,
        { weight: 3 }
      ).addTo(
        gisTools.drawings
      );

  } else {

    gisTools.currentPolygon.setLatLngs(
      gisTools.points
    );

  }

}


function gisFinishDrawing() {

  map.off(
    "click",
    gisLineClick
  );

  map.off(
    "click",
    gisPolygonClick
  );

  gisTools.activeTool = null;

  gisTools.points = [];

  gisTools.currentLine = null;

  gisTools.currentPolygon = null;

  map.getContainer().style.cursor = "";

}


function gisClearDrawings() {

  gisTools.drawings.clearLayers();

}


/* =========================================================
   SELECTION
   ========================================================= */

function gisSelectPoint() {

  gisFinishDrawing();

  gisTools.activeTool = "select";

  alert(
    "اکنون روی عارضه موردنظر کلیک کنید."
  );

}


function gisSelectRectangle() {

  const bounds = map.getBounds();

  alert(
    "برای انتخاب مستطیلی می‌توان این ابزار را " +
    "به Leaflet-Geoman یا Leaflet-Draw متصل کرد."
  );

}


function gisSelectPolygon() {

  alert(
    "برای انتخاب Polygon می‌توان ابزار " +
    "Leaflet-Geoman را به این بخش متصل کرد."
  );

}


function gisClearSelection() {

  gisTools.selections.clearLayers();

}


/* =========================================================
   BUFFER
   ========================================================= */

function gisCreateBuffer() {

  const distance =
    parseFloat(
      document.getElementById(
        "gisBufferDistance"
      ).value
    );

  if (!distance) {

    alert("فاصله بافر را وارد کنید.");

    return;

  }

  alert(
    "برای ایجاد Buffer دقیق جغرافیایی، " +
    "بهتر است از Turf.js استفاده شود."
  );

}


/* =========================================================
   COORDINATE CONVERSION
   ========================================================= */

function gisConvertToUTM() {

  const lat =
    parseFloat(
      document.getElementById(
        "gisLat"
      ).value
    );

  const lng =
    parseFloat(
      document.getElementById(
        "gisLng"
      ).value
    );

  if (
    isNaN(lat) ||
    isNaN(lng)
  ) {

    alert(
      "مختصات معتبر وارد کنید."
    );

    return;

  }

  /*
   * محاسبه تقریبی زون UTM
   */

  const zone =
    Math.floor(
      (lng + 180) / 6
    ) + 1;

  document.getElementById(
    "gisConversionResult"
  ).innerHTML =
    "UTM Zone: " +
    zone +
    "<br>" +
    "Latitude: " +
    lat.toFixed(6) +
    "<br>" +
    "Longitude: " +
    lng.toFixed(6);

}


/* =========================================================
   KMZ / KML
   ========================================================= */

function gisExportKMZ() {

  const layers =
    gisTools.drawings.getLayers();

  let kml =
`<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>`;

  layers.forEach(function(layer) {

    if (
      layer instanceof L.Marker
    ) {

      const p =
        layer.getLatLng();

      kml += `
<Placemark>
<Point>
<coordinates>
${p.lng},${p.lat},0
</coordinates>
</Point>
</Placemark>`;

    }

    if (
      layer instanceof L.Polyline &&
      !(layer instanceof L.Polygon)
    ) {

      const points =
        layer.getLatLngs();

      kml += `
<Placemark>
<LineString>
<coordinates>
${points
  .map(p => `${p.lng},${p.lat},0`)
  .join(" ")}
</coordinates>
</LineString>
</Placemark>`;

    }

  });

  kml += `
</Document>
</kml>`;

  const blob =
    new Blob(
      [kml],
      {type:"application/vnd.google-earth.kml+xml"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "gis-drawings.kml";

  a.click();

  URL.revokeObjectURL(url);

}


/* =========================================================
   PNG EXPORT
   ========================================================= */

function gisExportPNG() {

  if (
    typeof html2canvas === "undefined"
  ) {

    alert(
      "برای خروجی PNG کتابخانه html2canvas را اضافه کنید."
    );

    return;

  }

  html2canvas(
    document.getElementById("map")
  ).then(function(canvas) {

    const link =
      document.createElement("a");

    link.download =
      "gis-map.png";

    link.href =
      canvas.toDataURL();

    link.click();

  });

}

</script>
