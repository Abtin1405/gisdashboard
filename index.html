<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Web GIS</title>

<!-- Leaflet -->
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<!-- Leaflet Draw -->
<link rel="stylesheet"
      href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">

<style>

/* =========================================================
   GENERAL
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

body{
    background:#e9eef2;
}

button,
input,
select{
    font-family:inherit;
}

/* =========================================================
   APPLICATION
========================================================= */

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* =========================================================
   TOP BAR
========================================================= */

#topbar{

    height:58px;

    background:#17212b;

    color:white;

    display:flex;

    align-items:center;

    gap:8px;

    padding:7px 10px;

    z-index:5000;

    box-shadow:
        0 2px 8px rgba(0,0,0,.3);
}

#brand{

    font-size:16px;

    font-weight:bold;

    white-space:nowrap;

    padding:0 8px;
}

#searchBox{

    width:280px;

    height:38px;

    border:none;

    outline:none;

    border-radius:7px;

    padding:0 12px;

    direction:rtl;
}

.topButton{

    height:38px;

    border:none;

    border-radius:7px;

    padding:0 13px;

    background:#263746;

    color:white;

    cursor:pointer;

    font-size:12px;
}

.topButton:hover{

    background:#385165;
}

.topButton.primary{

    background:#1976d2;
}

.topButton.primary:hover{

    background:#1565c0;
}

/* =========================================================
   MAIN
========================================================= */

#main{

    position:relative;

    flex:1;

    min-height:0;
}

#map{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    background:#d9e0e5;
}

/* =========================================================
   SIDEBAR
========================================================= */

#sidebar{

    position:absolute;

    top:10px;

    right:10px;

    width:340px;

    max-height:
        calc(100% - 20px);

    background:white;

    border-radius:10px;

    overflow:hidden;

    z-index:3000;

    box-shadow:
        0 4px 20px rgba(0,0,0,.25);

    display:flex;

    flex-direction:column;
}

#sidebarHeader{

    height:48px;

    background:#263238;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 12px;

    font-size:14px;

    font-weight:bold;
}

#sidebarClose{

    background:none;

    border:none;

    color:white;

    font-size:22px;

    cursor:pointer;
}

#sidebarBody{

    overflow:auto;

    padding:9px;
}

/* =========================================================
   SECTION
========================================================= */

.gisSection{

    border:1px solid #dfe4e8;

    border-radius:8px;

    margin-bottom:9px;

    overflow:hidden;
}

.gisSectionTitle{

    background:#f3f5f6;

    padding:9px 10px;

    font-size:12px;

    font-weight:bold;

    color:#263238;
}

.gisSectionBody{

    padding:9px;
}

/* =========================================================
   BUTTONS
========================================================= */

.gisButton{

    border:1px solid #cbd3d8;

    background:white;

    color:#263238;

    border-radius:6px;

    padding:7px 8px;

    cursor:pointer;

    font-size:11px;

    width:100%;
}

.gisButton:hover{

    background:#eef2f4;
}

.gisButton.blue{

    background:#1976d2;

    color:white;

    border-color:#1976d2;
}

.gisButton.green{

    background:#2e7d32;

    color:white;

    border-color:#2e7d32;
}

.gisButton.red{

    background:#c62828;

    color:white;

    border-color:#c62828;
}

.buttonRow{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:6px;

    margin-bottom:6px;
}

/* =========================================================
   INPUT
========================================================= */

.gisInput{

    width:100%;

    height:32px;

    border:1px solid #cbd3d8;

    border-radius:6px;

    padding:5px 8px;

    margin-bottom:6px;

    font-size:11px;

    outline:none;
}

.gisInput:focus{

    border-color:#1976d2;
}

/* =========================================================
   LAYERS
========================================================= */

.layerItem{

    display:flex;

    align-items:center;

    gap:7px;

    padding:7px 3px;

    border-bottom:
        1px solid #eeeeee;

    font-size:11px;
}

.layerItem:last-child{

    border-bottom:none;
}

.layerName{

    flex:1;
}

.opacity{

    width:75px;
}

/* =========================================================
   STATUS
========================================================= */

#statusBar{

    height:28px;

    background:#263238;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 10px;

    font-size:10px;

    z-index:5000;
}

#coordinates{

    direction:ltr;

    font-family:monospace;
}

/* =========================================================
   TOAST
========================================================= */

#toast{

    position:absolute;

    left:50%;

    bottom:45px;

    transform:
        translateX(-50%);

    background:
        rgba(20,30,38,.94);

    color:white;

    padding:9px 15px;

    border-radius:7px;

    font-size:11px;

    z-index:6000;

    display:none;
}

/* =========================================================
   TABLE
========================================================= */

#attributeTable{

    max-height:220px;

    overflow:auto;
}

#attributeTable table{

    width:100%;

    border-collapse:collapse;

    font-size:10px;
}

#attributeTable th,
#attributeTable td{

    border:1px solid #ddd;

    padding:5px;

    text-align:right;
}

#attributeTable th{

    background:#f3f5f6;
}

/* =========================================================
   SEARCH RESULTS
========================================================= */

.searchResult{

    padding:7px;

    border-bottom:
        1px solid #eee;

    cursor:pointer;

    font-size:10px;
}

.searchResult:hover{

    background:#f3f5f6;
}

/* =========================================================
   LEAFLET
========================================================= */

.leaflet-control{

    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

.leaflet-popup-content{

    direction:rtl;

    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

/* =========================================================
   NORTH ARROW
========================================================= */

.northArrow{

    background:white;

    padding:7px;

    border-radius:6px;

    box-shadow:
        0 1px 5px rgba(0,0,0,.3);

    text-align:center;

    font-weight:bold;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    #brand{

        display:none;
    }

    #searchBox{

        width:150px;
    }

    #sidebar{

        width:300px;

        max-height:60%;
    }

}

</style>

</head>

<body>

<div id="app">

<!-- =====================================================
     TOP BAR
===================================================== -->

<div id="topbar">

    <div id="brand">
        سامانه Web GIS
    </div>

    <input
        id="searchBox"
        placeholder="جستجوی مکان..."
    >

    <button
        class="topButton primary"
        onclick="searchLocation()"
    >
        🔎 جستجو
    </button>

    <button
        class="topButton"
        onclick="goHome()"
    >
        🏠 خانه
    </button>

    <button
        class="topButton"
        onclick="locateUser()"
    >
        📍 موقعیت
    </button>

    <button
        class="topButton"
        onclick="toggleSidebar()"
    >
        ☰ ابزارها
    </button>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div id="main">

    <div id="map"></div>


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <div id="sidebar">

        <div id="sidebarHeader">

            <span>
                ابزارهای Web GIS
            </span>

            <button
                id="sidebarClose"
                onclick="toggleSidebar()"
            >
                ×
            </button>

        </div>


        <div id="sidebarBody">


            <!-- =========================================
                 BASE MAP
            ========================================== -->

            <div class="gisSection">

                <div class="gisSectionTitle">
                    🗺 نقشه پایه
                </div>

                <div class="gisSectionBody">

                    <div class="buttonRow">

                        <button
                            class="gisButton blue"
                            onclick="setBaseMap('satellite')"
                        >
                            🛰 ماهواره‌ای
                        </button>

                        <button
                            class="gisButton"
                            onclick="setBaseMap('street')"
                        >
                            🗺 خیابانی
                        </button>

                    </div>


                    <div class="buttonRow">

                        <button
                            class="gisButton"
                            onclick="setBaseMap('terrain')"
                        >
                            ⛰ توپوگرافی
                        </button>

                        <button
                            class="gisButton"
                            onclick="setBaseMap('dark')"
                        >
                            🌑 تاریک
                        </button>

                    </div>

                </div>

            </div>


            <!-- =========================================
                 LAYERS
            ========================================== -->

            <div class="gisSection">

                <div class="gisSectionTitle">
                    📚 مدیریت لایه‌ها
                </div>

                <div
                    class="gisSectionBody"
                    id="layerList"
                >
                </div>

            </div>


            <!-- =========================================
                 WMS
            ========================================== -->

            <div class="gisSection">

                <div class="gisSectionTitle">
                    🌐 اتصال WMS
                </div>

                <div class="gisSectionBody">

                    <input
                        id="wmsURL"
                        class="gisInput"
                        placeholder="آدرس سرویس WMS"
                    >

                    <input
                        id="wmsLayer"
                        class="gisInput"
                        placeholder="نام لایه"
                    >

                    <button
                        class="gisButton blue"
                        onclick="addWMSLayer()"
                    >
                        افزودن WMS
                    </button>

                </div>

            </div>


            <!-- =========================================
                 DRAW
            ========================================== -->

            <div class="gisSection">

                <div class="gisSectionTitle">
                    ✏️ ترسیم و ویرایش
                </div>

                <div class="gisSectionBody">

                    <div class="buttonRow">

                        <button
                            class="gisButton"
                            onclick="drawPoint()"
                        >
                            ● نقطه
                        </button>

                        <button
                            class="gisButton"
                            onclick="drawLine()"
                        >
                            ━ خط
                        </button>

                    </div>

                    <div class="buttonRow">

                        <button
                            class="gisButton"
                            onclick="drawPolygon()"
                        >
                            ⬠ پلیگون
                        </button>

                        <button
                            class="gisButton"
                            onclick="drawRectangle()"
                        >
                            ▣ مستطیل
                        </button>

                    </div>

                    <div class="buttonRow">

                        <button
                            class="gisButton"
                            onclick="editFeatures()"
                        >
                            ✏️ ویرایش
                        </button>

                        <button
                            class="gisButton red"
                            onclick="deleteFeatures()"
                        >
                            🗑 حذف
                        </button>

                    </div>

                </div>

            </div>


            <!-- =========================================
                 MEASUREMENT
            ========================================== -->

            <div class="gisSection">

                <div class="gisSectionTitle">
                    📐 اندازه‌گیری
                </div>

                <div class="gisSectionBody">

                    <div class="buttonRow">

                        <button
                            class="gisButton blue"
                            onclick="measureLength()"
                        >
                            📏 طول
                        </button>

                        <button
                            class="gisButton blue"
                            onclick="measureArea()"
                        >
                            ▱ مساحت
                        </button>

                    </div>

                    <button
                        class="gisButton"
                        onclick="clearMeasurements()"
                    >
                        پاک کردن اندازه‌گیری
                    </button>

                    <div
                        id="measurementResult"
                        style="
                        margin-top:7px;
                        font-size:10px;
                        color:#455a64;
                        "
                    >
                        آماده
                    </div>

                </div>

            </div>


            <!-- =========================================
                 SELECTION
            ========================================== -->

            <div class="gisSection">

                <div class="gisSectionTitle">
                    🎯 انتخاب عوارض
                </div>

                <div class="gisSectionBody">

                    <div class="buttonRow">

                        <button
                            class="gisButton"
                            onclick="selectRectangle()"
                        >
                            ▣ انتخاب مستطیلی
                        </button>

                        <button
                            class="gisButton"
                            onclick="clearSelection()"
                        >
                            پاک کردن
                        </button>

                    </div>

                </div>

            </div>


            <!-- =========================================
                 BUFFER
            ========================================== -->

            <div class="gisSection">

                <div class="gisSectionTitle">
                    ⭕ تحلیل Buffer
                </div>

                <div class="gisSectionBody">

                    <input
                        id="bufferDistance"
                        class="gisInput"
                        type="number"
                        min="1"
                        value="100"
                        placeholder="فاصله بر حسب متر"
                    >

                    <button
                        class="gisButton blue"
                        onclick="createBuffer()"
                    >
                        ایجاد Buffer
                    </button>

                </div>

            </div>


            <!-- =========================================
                 COORDINATES
            ========================================== -->

            <div class="gisSection">

                <div class="gisSectionTitle">
                    🔄 تبدیل مختصات
                </div>

                <div class="gisSectionBody">

                    <input
                        id="latitude"
                        class="gisInput"
                        placeholder="Latitude"
                    >

                    <input
                        id="longitude"
                        class="gisInput"
                        placeholder="Longitude"
                    >

                    <button
                        class="gisButton blue"
                        onclick="goToCoordinate()"
                    >
                        رفتن به مختصات
                    </button>

                    <hr>

                    <input
                        id="utmZone"
                        class="gisInput"
                        type="number"
                        min="1"
                        max="60"
                        placeholder="UTM Zone"
                    >

                    <input
                        id="utmEasting"
                        class="gisInput"
                        placeholder="Easting"
                    >

                    <input
                        id="utmNorthing"
                        class="gisInput"
                        placeholder="Northing"
                    >

                    <select
                        id="utmHemisphere"
                        class="gisInput"
                    >

                        <option value="north">
                            نیمکره شمالی
                        </option>

                        <option value="south">
                            نیمکره جنوبی
                        </option>

                    </select>


                    <div class="buttonRow">

                        <button
                            class="gisButton"
                            onclick="wgs84ToUTM()"
                        >
                            WGS84 → UTM
                        </button>

                        <button
                            class="gisButton"
                            onclick="utmToWGS84()"
                        >
                            UTM → WGS84
                        </button>

                    </div>


                    <div
                        id="coordinateResult"
                        style="
                        font-size:10px;
                        color:#455a64;
                        "
                    >
                    </div>

                </div>

            </div>


            <!-- =========================================
                 IMPORT / EXPORT
            ========================================== -->

            <div class="gisSection">

                <div class="gisSectionTitle">
                    📥 ورود و خروج داده
                </div>

                <div class="gisSectionBody">

                    <input
                        type="file"
                        id="geojsonFile"
                        accept=".geojson,.json"
                        class="gisInput"
                        onchange="importGeoJSONFile(this.files[0])"
                    >

                    <input
                        type="file"
                        id="csvFile"
                        accept=".csv,.xlsx,.xls"
                        class="gisInput"
                        onchange="importCoordinateFile(this.files[0])"
                    >

                    <div class="buttonRow">

                        <button
                            class="gisButton green"
                            onclick="exportGeoJSON()"
                        >
                            GeoJSON
                        </button>

                        <button
                            class="gisButton"
                            onclick="exportKML()"
                        >
                            KML
                        </button>

                    </div>

                    <div class="buttonRow">

                        <button
                            class="gisButton"
                            onclick="exportKMZ()"
                        >
                            KMZ
                        </button>

                        <button
                            class="gisButton"
                            onclick="exportPNG()"
                        >
                            PNG
                        </button>

                    </div>

                    <button
                        class="gisButton"
                        onclick="window.print()"
                    >
                        🖨 چاپ نقشه
                    </button>

                </div>

            </div>


            <!-- =========================================
                 ATTRIBUTE TABLE
            ========================================== -->

            <div class="gisSection">

                <div class="gisSectionTitle">
                    📋 جدول مشخصات
                </div>

                <div class="gisSectionBody">

                    <div id="attributeTable">

                        <div
                            style="
                            font-size:10px;
                            color:#607d8b;
                            "
                        >
                            برای مشاهده مشخصات،
                            یک عارضه را انتخاب کنید.
                        </div>

                    </div>

                </div>

            </div>


            <!-- =========================================
                 SEARCH RESULTS
            ========================================== -->

            <div class="gisSection">

                <div class="gisSectionTitle">
                    🔎 نتایج جستجو
                </div>

                <div
                    class="gisSectionBody"
                    id="searchResults"
                >
                </div>

            </div>

        </div>

    </div>


    <div id="toast"></div>

</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div id="statusBar">

    <span id="statusText">
        آماده
    </span>

    <span id="coordinates">
        Lat: -- | Lng: --
    </span>

</div>

</div>


<!-- =====================================================
     LIBRARIES
===================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>


<script>

/* =========================================================
   WEB GIS ENGINE
========================================================= */

(function(){

"use strict";


/* =========================================================
   MAP
========================================================= */

const map =
    L.map("map",{

        zoomControl:true,

        preferCanvas:true

    }).setView(
        [32.0,53.0],
        5
    );


/* =========================================================
   BASE MAPS
========================================================= */

const baseMaps = {

    satellite:

        L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

            {

                maxZoom:19,

                attribution:
                    "Tiles © Esri"

            }

        ),

    street:

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {

                maxZoom:19,

                attribution:
                    "© OpenStreetMap contributors"

            }

        ),

    terrain:

        L.tileLayer(
            "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",

            {

                maxZoom:17,

                attribution:
                    "© OpenTopoMap contributors"

            }

        ),

    dark:

        L.tileLayer(
            "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",

            {

                maxZoom:20,

                attribution:
                    "© OpenStreetMap © CARTO"

            }

        )

};


let currentBaseMap =
    "satellite";


baseMaps.satellite.addTo(map);


/* =========================================================
   GIS GROUPS
========================================================= */

const drawnItems =
    new L.FeatureGroup()
        .addTo(map);


const importedItems =
    new L.FeatureGroup()
        .addTo(map);


const bufferItems =
    new L.FeatureGroup()
        .addTo(map);


const measurementItems =
    new L.FeatureGroup()
        .addTo(map);


const selectionItems =
    new L.FeatureGroup()
        .addTo(map);


/* =========================================================
   LAYER REGISTRY
========================================================= */

const layers = {

    "ترسیمات کاربر":
        drawnItems,

    "لایه‌های واردشده":
        importedItems,

    "Buffer":
        bufferItems,

    "اندازه‌گیری":
        measurementItems,

    "انتخاب":
        selectionItems

};


/* =========================================================
   UI
========================================================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.style.display =
        "block";

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            function(){

                toast.style.display =
                    "none";

            },
            3000
        );
}


function setStatus(message){

    document.getElementById(
        "statusText"
    ).textContent =
        message;
}


/* =========================================================
   COORDINATES
========================================================= */

map.on(
    "mousemove",
    function(e){

        document.getElementById(
            "coordinates"
        ).textContent =

            "Lat: " +
            e.latlng.lat.toFixed(6) +

            " | Lng: " +
            e.latlng.lng.toFixed(6);

    }
);


map.on(
    "click",
    function(e){

        document.getElementById(
            "latitude"
        ).value =
            e.latlng.lat.toFixed(6);

        document.getElementById(
            "longitude"
        ).value =
            e.latlng.lng.toFixed(6);

    }
);


/* =========================================================
   HOME
========================================================= */

window.goHome =
function(){

    map.setView(
        [32.0,53.0],
        5
    );

};


/* =========================================================
   SIDEBAR
========================================================= */

window.toggleSidebar =
function(){

    const sidebar =
        document.getElementById(
            "sidebar"
        );

    if(
        sidebar.style.display ===
        "none"
    ){

        sidebar.style.display =
            "flex";

    }

    else{

        sidebar.style.display =
            "none";

    }

};


/* =========================================================
   BASE MAP
========================================================= */

window.setBaseMap =
function(name){

    Object.values(
        baseMaps
    ).forEach(
        function(layer){

            map.removeLayer(layer);

        }
    );


    baseMaps[name]
        .addTo(map);


    currentBaseMap =
        name;


    updateLayerPanel();

    showToast(
        "نقشه پایه تغییر کرد."
    );

};


/* =========================================================
   LAYER PANEL
========================================================= */

function updateLayerPanel(){

    const panel =
        document.getElementById(
            "layerList"
        );

    panel.innerHTML = "";


    const baseNames = {

        satellite:
            "🛰 ماهواره‌ای",

        street:
            "🗺 خیابانی",

        terrain:
            "⛰ توپوگرافی",

        dark:
            "🌑 تاریک"

    };


    Object.keys(
        baseMaps
    ).forEach(
        function(key){

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "layerItem";


            div.innerHTML =

                "<input type='radio' " +

                (
                    currentBaseMap === key
                    ?
                    "checked"
                    :
                    ""
                ) +

                " name='baseMap'>" +

                "<span class='layerName'>" +

                baseNames[key] +

                "</span>";


            div
                .querySelector(
                    "input"
                )
                .onclick =
                    function(){

                        setBaseMap(key);

                    };


            panel.appendChild(div);

        }
    );


    Object.keys(
        layers
    ).forEach(
        function(name){

            const layer =
                layers[name];


            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "layerItem";


            const visible =
                map.hasLayer(layer);


            div.innerHTML =

                "<input type='checkbox' " +

                (
                    visible
                    ?
                    "checked"
                    :
                    ""
                ) +

                ">" +

                "<span class='layerName'>" +

                name +

                "</span>" +

                "<input class='opacity' " +

                "type='range' " +

                "min='0' " +

                "max='1' " +

                "step='0.05' " +

                "value='1'>";


            const checkbox =
                div.querySelector(
                    "input[type='checkbox']"
                );


            const opacity =
                div.querySelector(
                    ".opacity"
                );


            checkbox.onchange =
                function(){

                    if(
                        checkbox.checked
                    ){

                        map.addLayer(
                            layer
                        );

                    }

                    else{

                        map.removeLayer(
                            layer
                        );

                    }

                };


            opacity.oninput =
                function(){

                    layer.eachLayer(
                        function(item){

                            if(
                                item.setStyle
                            ){

                                item.setStyle({

                                    opacity:
                                        Number(
                                            opacity.value
                                        ),

                                    fillOpacity:
                                        Number(
                                            opacity.value
                                        ) * .25

                                });

                            }

                        }
                    );

                };


            panel.appendChild(
                div
            );

        }
    );

}

/* =========================================================
   FEATURE PROPERTIES
========================================================= */

let featureID = 1;


function attachLayer(
    layer,
    properties={}
){

    layer.gisID =
        featureID++;


    layer.gisProperties =
        properties;


    layer.on(
        "click",
        function(e){

            L.DomEvent.stopPropagation(
                e
            );

            selectLayer(
                layer
            );

        }
    );

}


/* =========================================================
   SELECT LAYER
========================================================= */

let selectedLayer =
    null;


function selectLayer(
    layer
){

    selectedLayer =
        layer;


    selectionItems.clearLayers();


    let highlight;


    if(
        layer instanceof L.Marker
    ){

        highlight =
            L.circleMarker(
                layer.getLatLng(),
                {

                    radius:10,

                    color:"#ff0000",

                    weight:3,

                    fillOpacity:0

                }
            );

    }

    else if(
        layer instanceof L.Polygon
    ){

        highlight =
            L.polygon(
                layer.getLatLngs(),
                {

                    color:"#ff0000",

                    weight:4,

                    fillOpacity:0

                }
            );

    }

    else if(
        layer instanceof L.Polyline
    ){

        highlight =
            L.polyline(
                layer.getLatLngs(),
                {

                    color:"#ff0000",

                    weight:6

                }
            );

    }


    if(highlight){

        selectionItems.addLayer(
            highlight
        );

    }


    showAttributes(
        layer
    );

}

let measurementMode =
    null;

    [];

let measurementLine =
    null;

    null;


function stopMeasurement(){

    if(

/* =========================================================
   LENGTH
========================================================= */

window.measureLength =
function(){

    clearMeasurements();

    measurementMode =
        "length";


    document.getElementById(
        "measurementResult"
    ).textContent =
        "روی نقشه کلیک کنید؛ برای پایان دوبار کلیک کنید.";


    map.on(
        "click",
        measurementClick
    );

};


function measurementClick(
    e
){

    measurementPoints.push(
        e.latlng
    );


    if(
        measurementMode ===
        "length"
    ){

        if(
            !measurementLine
        ){

            measurementLine =
                L.polyline(
                    [],
                    {

                        weight:4

                    }
                ).addTo(
                    measurementItems
                );

        }


        measurementLine.setLatLngs(
            measurementPoints
        );


        let total =
            0;


        for(
            let i=1;
            i<measurementPoints.length;
            i++
        ){

            total +=
                measurementPoints[
                    i-1
                ].distanceTo(
                    measurementPoints[i]
                );

        }


        if(
            total < 1000
        ){

            document.getElementById(
                "measurementResult"
            ).textContent =

                "طول: " +

                total.toFixed(2) +

                " متر";

        }

        else{

            document.getElementById(
                "measurementResult"
            ).textContent =

                "طول: " +

                (
                    total/1000
                ).toFixed(3) +

                " کیلومتر";

        }

    }


    if(
        measurementMode ===
        "area"
    ){

        if(
            !measurementPolygon
        ){

            measurementPolygon =
                L.polygon(
                    [],
                    {

                        weight:3,

                        fillOpacity:.15

                    }
                ).addTo(
                    measurementItems
                );

        }


        measurementPolygon.setLatLngs(
            measurementPoints
        );


        if(
            measurementPoints.length >= 3
        ){

            const coordinates =
                measurementPoints.map(
                    function(p){

                        return [
                            p.lng,
                            p.lat
                        ];

                    }
                );


            coordinates.push(
                coordinates[0]
            );


            const polygon =
                turf.polygon([
                    coordinates
                ]);


            const area =
                turf.area(
                    polygon
                );


            if(
                area < 1000000
            ){

                document.getElementById(
                    "measurementResult"
                ).textContent =

                    "مساحت: " +

                    area.toFixed(2) +

                    " مترمربع";

            }

            else{

                document.getElementById(
                    "measurementResult"
                ).textContent =

                    "مساحت: " +

                    (
                        area/1000000
                    ).toFixed(3) +

                    " کیلومترمربع";

            }

        }

    }

}

window.selectRectangle =
function(){

    const tool =
        new L.Draw.Rectangle(
            map,
            {

                shapeOptions:{

                    color:"#ff0000",

                    fillOpacity:.1

            drawnItems.eachLayer(

                        if(
                            bounds.contains(
                                layer.getLatLng()
                            )
                        ){

                            selectLayer(

                            );

                            count++;

                    }

                    else if(
                        layer.getBounds
                    ){

                        if(
                            bounds.intersects(
                                layer.getBounds()
                            )
                        ){

                            selectLayer(
                                layer
                            );

                            count++;

                        }

                    }

                }
            );


            showToast(
                count +
                " عارضه انتخاب شد."

        }
    );

};

/* =========================================================
   WGS84 → UTM
========================================================= */

window.wgs84ToUTM =
function(){

    const lat =
        Number(
            document.getElementById(
                "latitude"
            ).value
        );


    const lng =
        Number(
            document.getElementById(
                "longitude"
            ).value
        );


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        showToast(
            "Latitude و Longitude را وارد کنید."
        );

        return;

    }


    const zone =
        Math.floor(
            (
                lng + 180
            ) / 6
        ) + 1;


    const south =
        lat < 0;


    const definition =

        "+proj=utm " +

        "+zone=" +
        zone +

        " " +

        (
            south
            ?
            "+south "
            :
            ""
        ) +

        "+datum=WGS84 " +

        "+units=m " +

        "+no_defs";


    const result =
        proj4(
            "EPSG:4326",
            definition,
            [
                lng,
                lat
            ]
        );


    document.getElementById(
        "utmZone"
    ).value =
        zone;


    document.getElementById(
        "utmEasting"
    ).value =
        result[0].toFixed(3);


    document.getElementById(
        "utmNorthing"
    ).value =
        result[1].toFixed(3);


    document.getElementById(
        "utmHemisphere"
    ).value =
        south
        ?
        "south"
        :
        "north";


    document.getElementById(
        "coordinateResult"
    ).innerHTML =

        "Zone: " +
        zone +

        "<br>" +

        "Easting: " +
        result[0].toFixed(3) +

        "<br>" +

        "Northing: " +
        result[1].toFixed(3);

};


/* =========================================================
   UTM → WGS84
========================================================= */

window.utmToWGS84 =
function(){

    const zone =
        Number(
            document.getElementById(
                "utmZone"
            ).value
        );


    const easting =
        Number(
            document.getElementById(
                "utmEasting"
            ).value
        );


    const northing =
        Number(
            document.getElementById(
                "utmNorthing"
            ).value
        );


    if(
        !zone ||
        zone < 1 ||
        zone > 60 ||
        !Number.isFinite(
            easting
        ) ||
        !Number.isFinite(
            northing
        )
    ){

        showToast(
            "مقادیر UTM معتبر نیست."
        );

        return;

    }


    const south =
        document.getElementById(
            "utmHemisphere"
        ).value ===
        "south";


    const definition =

        "+proj=utm " +

        "+zone=" +
        zone +

        " " +

        (
            south
            ?
            "+south "
            :
            ""
        ) +

        "+datum=WGS84 " +

        "+units=m " +

        "+no_defs";


    const result =
        proj4(
            definition,
            "EPSG:4326",
            [
                easting,
                northing
            ]
        );


    const lng =
        result[0];

    const lat =
        result[1];


    document.getElementById(
        "latitude"
    ).value =
        lat.toFixed(6);


    document.getElementById(
        "longitude"
    ).value =
        lng.toFixed(6);


    document.getElementById(
        "coordinateResult"
    ).innerHTML =

        "Latitude: " +
        lat.toFixed(6) +

        "<br>" +

        "Longitude: " +
        lng.toFixed(6);


    map.setView(
        [
            lat,
            lng
        ],
        15
    );

};

window.searchLocation =
async function(){

    const query =
        document.getElementById(
            "searchBox"
        ).value.trim();


    if(
        !query
    ){

        return;

    }


    const resultPanel =
        document.getElementById(
            "searchResults"
        );


    resultPanel.innerHTML =
        "در حال جستجو...";


    try{

        const url =

            "https://nominatim.openstreetmap.org/search" +

            "?format=jsonv2" +

            "&limit=8" +

            "&q=" +

            encodeURIComponent(
                query
            );


        const response =
            await fetch(
                url,
                {

                    headers:{

                        "Accept-Language":
                            "fa"

                    }

                }
            );


        const results =
            await response.json();


        resultPanel.innerHTML =
            "";


        if(
            results.length === 0
        ){

            resultPanel.innerHTML =
                "نتیجه‌ای پیدا نشد.";

            return;

        }


        results.forEach(
            function(item){

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "searchResult";


                div.textContent =
                    item.display_name;


                div.onclick =
                    function(){

                        const lat =
                            Number(
                                item.lat
                            );

                        const lng =
                            Number(
                                item.lon
                            );


                        map.setView(
                            [
                                lat,
                                lng
                            ],
                            15
                        );


                        L.marker(
                            [
                                lat,
                                lng
                            ]
                        )
                        .addTo(
                            drawnItems
                        )
                        .bindPopup(
                            item.display_name
                        )
                        .openPopup();

                    };


                resultPanel.appendChild(
                    div
                );

            }
        );

    }

    catch(error){

        resultPanel.innerHTML =
            "خطا در سرویس جستجو.";

    }

};

window.importGeoJSONFile =
function(file){

    if(
        !file
    ){

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(event){

            try{

                const data =
                    JSON.parse(
                        event.target.result
                    );


                const geoLayer =
                    L.geoJSON(
                        data,
                        {

                            style:{

                                weight:3,

                                fillOpacity:.2

                            },

                            onEachFeature:
                                function(
                                    feature,
                                    layer
                                ){

                                    attachLayer(
                                        layer,
                                        feature.properties || {}
                                    );

                                }

                        }
                    );


                geoLayer.addTo(
                    importedItems
                );


                if(
                    geoLayer.getBounds().isValid()
                ){

                    map.fitBounds(
                        geoLayer.getBounds(),
                        {

                            padding:[
                                30,
                                30
                            ]

                        }
                    );

                }


                updateLayerPanel();


                showToast(
                    "GeoJSON وارد شد."
                );

            }

            catch(error){

                showToast(
                    "فایل GeoJSON معتبر نیست."
                );

            }

        };


    reader.readAsText(
        file,
        "UTF-8"
    );

};


/* =========================================================
   IMPORT CSV / EXCEL
========================================================= */

window.importCoordinateFile =
function(file){

    if(
        !file
    ){

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(event){

            try{

                const workbook =
                    XLSX.read(
                        event.target.result,
                        {

                            type:"array"

                        }
                    );


                const sheet =
                    workbook.Sheets[
                        workbook.SheetNames[0]
                    ];


                const rows =
                    XLSX.utils.sheet_to_json(
                        sheet,
                        {

                            defval:""

                        }
                    );


                let count =
                    0;


                rows.forEach(
                    function(row){

                        const lat =
                            Number(
                                row.Latitude ??
                                row.latitude ??
                                row.lat ??
                                row.LAT ??
                                ""
                            );


                        const lng =
                            Number(
                                row.Longitude ??
                                row.longitude ??
                                row.lng ??
                                row.lon ??
                                row.LNG ??
                                ""
                            );


                        if(
                            Number.isFinite(lat) &&
                            Number.isFinite(lng)
                        ){

                            const marker =
                                L.marker(
                                    [
                                        lat,
                                        lng
                                    ]
                                );


                            marker.addTo(
                                importedItems
                            );


                            attachLayer(
                                marker,
                                row
                            );


                            marker.bindPopup(
                                createPopup(
                                    row
                                )
                            );


                            count++;

                        }

                    }
                );


                if(
                    count > 0
                ){

                    if(
                        importedItems
                            .getBounds()
                            .isValid()
                    ){

                        map.fitBounds(
                            importedItems
                                .getBounds(),
                            {

                                padding:[
                                    30,
                                    30
                                ]

                            }
                        );

                    }


                    updateLayerPanel();


                    showToast(
                        count +
                        " نقطه وارد شد."
                    );

                }

                else{

                    showToast(
                        "ستون Latitude/Longitude پیدا نشد."
                    );

                }

            }

            catch(error){

                console.error(
                    error
                );

                showToast(
                    "خطا در خواندن فایل."
                );

            }

        };


    reader.readAsArrayBuffer(
        file
    );

};


/* =========================================================
   POPUP
========================================================= */

function createPopup(
    properties
){

    let html =
        "<b>مشخصات عارضه</b><hr>";


    Object.keys(
        properties
    ).forEach(
        function(key){

            html +=

                "<b>" +

                escapeHTML(
                    key
                ) +

                "</b>: " +

                escapeHTML(
                    String(
                        properties[key]
                    )
                ) +

                "<br>";

        }
    );


    return html;

}


/* =========================================================
   EXPORT GEOJSON
========================================================= */

window.exportGeoJSON =
function(){

    const features =
        [];


    [
        drawnItems,
        importedItems,
        bufferItems
    ]
    .forEach(
        function(group){

            group.eachLayer(
                function(layer){

                    if(
                        layer.toGeoJSON
                    ){

                        features.push(
                            layer.toGeoJSON()
                        );

                    }

                }
            );

        }
    );


    const data = {

        type:
            "FeatureCollection",

        features:
            features

    };


    downloadFile(

        JSON.stringify(
            data,
            null,
            2
        ),

        "webgis.geojson",

        "application/json"

    );

};


/* =========================================================
   KML
========================================================= */

function generateKML(){

    let kml =

        '<?xml version="1.0" encoding="UTF-8"?>' +

        '<kml xmlns="http://www.opengis.net/kml/2.2">' +

        '<Document>';


    [
        drawnItems,
        importedItems,
        bufferItems
    ]
    .forEach(
        function(group){

            group.eachLayer(
                function(layer){

                    if(
                        !layer.toGeoJSON
                    ){

                        return;

                    }


                    const geo =
                        layer.toGeoJSON();


                    const geometry =
                        geo.geometry;


                    const name =
                        "Web GIS Feature";


                    if(
                        geometry.type ===
                        "Point"
                    ){

                        const p =
                            geometry.coordinates;


                        kml +=

                            "<Placemark>" +

                            "<name>" +
                            name +
                            "</name>" +

                            "<Point>" +

                            "<coordinates>" +

                            p[0] +
                            "," +
                            p[1] +
                            ",0" +

                            "</coordinates>" +

                            "</Point>" +

                            "</Placemark>";

                    }


                    if(
                        geometry.type ===
                        "LineString"
                    ){

                        kml +=

                            "<Placemark>" +

                            "<name>" +
                            name +
                            "</name>" +

                            "<LineString>" +

                            "<tessellate>1</tessellate>" +

                            "<coordinates>" +

                            geometry
                                .coordinates
                                .map(
                                    function(p){

                                        return (
                                            p[0] +
                                            "," +
                                            p[1] +
                                            ",0"
                                        );

                                    }
                                )
                                .join(" ") +

                            "</coordinates>" +

                            "</LineString>" +

                            "</Placemark>";

                    }


                    if(
                        geometry.type ===
                        "Polygon"
                    ){

                        const ring =
                            geometry
                                .coordinates[0];


                        kml +=

                            "<Placemark>" +

                            "<name>" +
                            name +
                            "</name>" +

                            "<Polygon>" +

                            "<outerBoundaryIs>" +

                            "<LinearRing>" +

                            "<coordinates>" +

                            ring
                                .map(
                                    function(p){

                                        return (
                                            p[0] +
                                            "," +
                                            p[1] +
                                            ",0"
                                        );

                                    }
                                )
                                .join(" ") +

                            "</coordinates>" +

                            "</LinearRing>" +

                            "</outerBoundaryIs>" +

                            "</Polygon>" +

                            "</Placemark>";

                    }

                }
            );

        }
    );


    kml +=

        "</Document>" +

        "</kml>";


    return kml;

}


/* =========================================================
   EXPORT KML
========================================================= */

window.exportKML =
function(){

    const kml =
        generateKML();


    downloadFile(

        kml,

        "webgis.kml",

};

window.exportKMZ =
async function(){

    const kml =
        generateKML();


    const zip =
        new JSZip();


    zip.file(
        "doc.kml",
        kml
    );


    const blob =
        await zip.generateAsync(
            {

                type:"blob"

            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "webgis.kmz";


    a.click();


    URL.revokeObjectURL(
        url
    );

};

/* =========================================================
   DOWNLOAD
========================================================= */

function downloadFile(
    content,
    filename,
    type
){

    const blob =
        new Blob(
            [
                content
            ],
            {

                type:
                    type

            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        filename;


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(
    value
){

    return String(
        value
    )
    .replace(
        /[&<>"']/g,
        function(char){

            return {

                "&":"&amp;",

                "<":"&lt;",

                ">":"&gt;",

                '"':"&quot;",

                "'":"&#039;"

            }[char];

        }
    );

}
